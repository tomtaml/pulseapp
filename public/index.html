<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5d4b" />
  <meta name="description" content="PULSE SRF mobile workshop prototype" />
  <title>PULSE workshop prototype</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://challenges.cloudflare.com" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to app</a>
  <header class="topbar">
    <div><strong>PULSE</strong><span id="variantBadge" class="badge">Workshop prototype</span></div>
    <div class="toolbar" aria-label="Accessibility controls">
      <button id="languageBtn" class="ghost" type="button">FI / EN</button>
      <button id="textSizeBtn" class="ghost" type="button">A+</button>
      <button id="contrastBtn" class="ghost" type="button">◐</button>
    </div>
  </header>
  <main id="app" class="shell" tabindex="-1">
    <section class="card" id="screen" aria-live="polite"></section>
  </main>
  <footer class="footer">
    <span>Research prototype — not a real charging service</span>
    <span>No name, email, phone or precise location requested</span>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
