<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b5d4b">
  <title>PULSE study variant preview</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/v13-study.css">
</head>
<body>
  <a class="skip-link" href="#study">Skip to study</a>
  <header class="topbar">
    <div class="brand-block"><strong>PULSE</strong><span id="siteBadge" class="badge"></span><span id="modeBadge" class="status-badge"></span></div>
    <div class="toolbar" aria-label="Display controls">
      <button id="readButton" class="ghost" type="button" hidden>Read aloud</button>
      <button id="textButton" class="ghost" type="button" aria-pressed="false">A+</button>
      <button id="contrastButton" class="ghost" type="button" aria-pressed="false">High contrast</button>
    </div>
  </header>
  <main id="study" class="shell" tabindex="-1"><section id="screen" class="card" aria-live="polite" tabindex="-1"></section></main>
  <footer class="footer">Research prototype · simulated charging · no personal identifiers requested</footer>
  <script type="module" src="/js/v13-app.js"></script>
</body>
</html>
